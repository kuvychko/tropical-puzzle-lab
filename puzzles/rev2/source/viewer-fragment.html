<div id="tropical-puzzle-rev2">
<h3>Rev 2 · nine pieces, four inside</h3>
<div class="viz-controls">
<label class="form-label">Puzzle<select id="tp-state" class="form-select"><option value="0">Rev 2 · recommended</option><option value="1">Rev 2 · alternative</option><option value="2">Rev 1 · reference</option></select></label>
<label class="form-label">Assembly<select id="tp-layout" class="form-select"><option value="0">Assembled</option><option value="1">Exploded</option></select></label>
<label class="form-label">View<select id="tp-view" class="form-select"><option value="48">Oblique</option><option value="90">From above</option><option value="25">Low angle</option></select></label>
<label class="form-label">Inspect piece<select id="tp-piece" class="form-select"><option value="">All pieces</option></select></label>
</div>
<label class="form-check"><input id="tp-teach" class="form-check-input" type="checkbox"><span class="form-check-label">Show labels and highlight interior pieces</span></label>
<svg id="tp-scene" role="img" aria-label="Three-dimensional model of a framed tropical polynomial puzzle"></svg>
<div id="tp-detail" class="text-small" aria-live="polite"></div>
</div>
<style>#tropical-puzzle-rev2 svg{display:block;width:100%;height:390px}#tropical-puzzle-rev2 svg text{font-size:12px;fill:var(--foreground)}#tropical-puzzle-rev2 .viz-controls{margin-bottom:8px}</style>
<script>
(()=>{
const data=__GEOMETRY__;
const root=document.getElementById('tropical-puzzle-rev2'),svg=root.querySelector('#tp-scene'),state=root.querySelector('#tp-state'),layout=root.querySelector('#tp-layout'),view=root.querySelector('#tp-view'),pick=root.querySelector('#tp-piece'),detail=root.querySelector('#tp-detail'),teach=root.querySelector('#tp-teach');
const ns='http://www.w3.org/2000/svg';
function element(tag,attrs,text){const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);if(text!==undefined)node.textContent=text;svg.appendChild(node);return node;}
function refreshPieces(){const old=pick.value;pick.replaceChildren(new Option('All pieces',''));for(const p of data.states[+state.value].pieces)pick.add(new Option('Piece '+p.id,p.id));if([...pick.options].some(o=>o.value===old))pick.value=old;draw();}
function draw(){
const width=root.clientWidth,height=390,ex=+layout.value,elev=+view.value*Math.PI/180,yaw=-63*Math.PI/180,ct=Math.cos(yaw),st=Math.sin(yaw),ce=Math.cos(elev),se=Math.sin(elev),scale=Math.min((width-30)/(ex?295:230),ex?1.05:1.4);
svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.replaceChildren();
const project=v=>{const horizontal=-st*v[0]+ct*v[1],along=ct*v[0]+st*v[1];return [width/2+scale*horizontal,height/2+28-scale*(se*(-along)+ce*v[2]),ce*along+se*v[2]];};
const camera=[ce*ct,ce*st,se],chosen=data.states[+state.value],faces=[],labels=[];
for(const obj of [data.tray,...chosen.pieces]){
const piece=!!obj.id,selected=piece&&obj.id===pick.value,offset=piece?[obj.center[0]*.42*ex,obj.center[1]*.42*ex,ex*(obj.interior?38:22)+(selected?13:0)]:[0,0,0];
const v=obj.vertices.map(q=>q.map((x,i)=>x+offset[i]));
for(const panel of obj.panels){
const q=panel.map(i=>v[i]),a=q[1].map((x,i)=>x-q[0][i]),b=q[2].map((x,i)=>x-q[0][i]),n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=Math.hypot(...n),facing=n.reduce((s,x,i)=>s+x*camera[i],0)/norm;
if(facing<1e-8)continue;
const points=q.map(project),top=n[2]/norm>.1;
faces.push({points,depth:points.reduce((s,p)=>s+p[2],0)/points.length,piece,id:obj.id,fill:piece?(obj.interior&&teach.checked?'var(--viz-series-2)':'var(--viz-series-1)'):'var(--muted)',opacity:piece?(selected?.95:.35+.35*Math.max(0,(n[0]*-.3+n[1]*-.4+n[2]*.866)/norm)):1});
}
if(piece&&(teach.checked||selected))labels.push({id:obj.id,p:project(obj.center.map((x,i)=>x+offset[i]+(i===2?.6:0)))});
}
faces.sort((a,b)=>Number(a.piece)-Number(b.piece)||a.depth-b.depth);
for(const f of faces){element('polygon',{points:f.points.map(p=>p.slice(0,2).join(',')).join(' '),fill:'var(--background)'});element('polygon',{points:f.points.map(p=>p.slice(0,2).join(',')).join(' '),fill:f.fill,'fill-opacity':f.opacity,stroke:'var(--foreground)','stroke-opacity':'.55','stroke-width':'.8'});}
for(const l of labels)element('text',{x:l.p[0],y:l.p[1],'text-anchor':'middle','dominant-baseline':'middle'},l.id);
const p=chosen.pieces.find(p=>p.id===pick.value);
detail.textContent=p?`Piece ${p.id}: ${p.term.a}x + ${p.term.b}y ${p.term.c<0?'−':'+'} ${Math.abs(p.term.c).toFixed(2)} · lifted for inspection`:`${chosen.pieces.length} pieces · ${chosen.pieces.filter(p=>p.interior).length} fully interior · 152 × 152 mm outer frame`;
}
state.addEventListener('change',refreshPieces);for(const input of [layout,view,pick,teach])input.addEventListener('change',draw);new ResizeObserver(draw).observe(root);refreshPieces();
})();
</script>
